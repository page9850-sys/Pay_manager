<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>급여일 선출금 자산 관리 앱</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 & ReactDOM 18 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone for JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Chart.js for trends -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
    }
    /* Hide scrollbar for clean horizontal scrolling */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="text-slate-800 antialiased selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // 초기 샘플 데이터 (기산일 및 과거 누적 기적 적용)
    const DEFAULT_ACCOUNTS = [
      { id: 'acc_1', name: '공과금 통장', color: 'bg-emerald-500', note: '관리비, 가스비, 주유비', startDate: '2024-01-01', basePastAccumulated: 4200000 },
      { id: 'acc_2', name: '고정비 통장', color: 'bg-indigo-500', note: '보험료, 대출이자, 구독료', startDate: '2024-01-01', basePastAccumulated: 7800000 },
      { id: 'acc_3', name: '카드대금 통장', color: 'bg-amber-500', note: '생활비 신용카드 결제', startDate: '2024-01-01', basePastAccumulated: 9500000 },
      { id: 'acc_4', name: '자산/저축 통장', color: 'bg-blue-500', note: '청약, 적금, 자유투자', startDate: '2024-01-01', basePastAccumulated: 18500000 },
    ];

    const DEFAULT_TRANSACTIONS = [
      // 수입 (INCOME)
      { id: 'tx_1', type: 'INCOME', isFixed: true, category: '급여', title: '기본 급여 수입', estimatedAmount: 3200000, actualAmount: 3200000, targetAccount: '자산/저축 통장', dueDay: 25, isCompleted: true },
      { id: 'tx_2', type: 'INCOME', isFixed: false, category: '월세', title: '월세 임대 수입', estimatedAmount: 500000, actualAmount: 500000, targetAccount: '자산/저축 통장', dueDay: 20, isCompleted: true },
      
      // 고정 지출 (EXPENSE - FIXED)
      { id: 'tx_3', type: 'EXPENSE', isFixed: true, category: '보험료', title: '실손/건강 보험료', estimatedAmount: 180000, actualAmount: 180000, targetAccount: '고정비 통장', dueDay: 25, isCompleted: true, history: { '2026-01': 180000, '2026-02': 180000, '2026-03': 180000, '2026-04': 180000, '2026-05': 180000, '2026-06': 180000, '2026-07': 180000, '2026-08': 180000, '2026-09': 180000 } },
      { id: 'tx_4', type: 'EXPENSE', isFixed: true, category: '대출이자', title: '주택담보대출 이자', estimatedAmount: 420000, actualAmount: 420000, targetAccount: '고정비 통장', dueDay: 25, isCompleted: true, history: { '2026-01': 420000, '2026-02': 420000, '2026-03': 420000, '2026-04': 420000, '2026-05': 420000, '2026-06': 420000, '2026-07': 420000, '2026-08': 420000, '2026-09': 420000 } },
      { id: 'tx_5', type: 'EXPENSE', isFixed: true, category: '저축', title: '주택청약 종합저축', estimatedAmount: 100000, actualAmount: 100000, targetAccount: '자산/저축 통장', dueDay: 25, isCompleted: false, history: { '2026-01': 100000, '2026-02': 100000, '2026-03': 100000, '2026-04': 100000, '2026-05': 100000, '2026-06': 100000, '2026-07': 100000, '2026-08': 100000, '2026-09': 100000 } },
      { id: 'tx_6', type: 'EXPENSE', isFixed: true, category: '구독료', title: 'OTT 및 통신 구독료', estimatedAmount: 45000, actualAmount: 45000, targetAccount: '고정비 통장', dueDay: 28, isCompleted: false, history: { '2026-01': 45000, '2026-02': 45000, '2026-03': 45000, '2026-04': 45000, '2026-05': 45000, '2026-06': 45000, '2026-07': 45000, '2026-08': 45000, '2026-09': 45000 } },
      
      // 변동 지출 (EXPENSE - VARIABLE)
      { id: 'tx_7', type: 'EXPENSE', isFixed: false, category: '관리비', title: '아파트 관리비', estimatedAmount: 190000, actualAmount: 215000, targetAccount: '공과금 통장', dueDay: 25, isCompleted: true, history: { '2026-01': 210000, '2026-02': 225000, '2026-03': 195000, '2026-04': 195000, '2026-05': 180000, '2026-06': 182000, '2026-07': 185000, '2026-08': 240000, '2026-09': 215000 } },
      { id: 'tx_8', type: 'EXPENSE', isFixed: false, category: '가스비', title: '도시가스 난방비', estimatedAmount: 35000, actualAmount: 28000, targetAccount: '공과금 통장', dueDay: 25, isCompleted: true, history: { '2026-01': 85000, '2026-02': 92000, '2026-03': 65000, '2026-04': 65000, '2026-05': 32000, '2026-06': 21000, '2026-07': 18000, '2026-08': 16000, '2026-09': 28000 } },
      { id: 'tx_9', type: 'EXPENSE', isFixed: false, category: '주유비', title: '차량 주유비', estimatedAmount: 150000, actualAmount: 160000, targetAccount: '공과금 통장', dueDay: 25, isCompleted: false, history: { '2026-01': 140000, '2026-02': 150000, '2026-03': 150000, '2026-04': 150000, '2026-05': 145000, '2026-06': 160000, '2026-07': 140000, '2026-08': 150000, '2026-09': 160000 } },
      { id: 'tx_10', type: 'EXPENSE', isFixed: false, category: '카드대금', title: '생활비 신용카드 대금', estimatedAmount: 800000, actualAmount: 850000, targetAccount: '카드대금 통장', dueDay: 25, isCompleted: false, history: { '2026-01': 750000, '2026-02': 790000, '2026-03': 810000, '2026-04': 800000, '2026-05': 820000, '2026-06': 790000, '2026-07': 780000, '2026-08': 820000, '2026-09': 850000 } },
    ];

    // 한국 공휴일 및 주말 고려 25일 급여일 계산 함수
    const calculateAdjustedPayday = (year, month) => {
      let targetDate = new Date(year, month - 1, 25);
      
      const isHoliday = (d) => {
        const m = d.getMonth() + 1;
        const date = d.getDate();
        if (m === 9 && (date === 24 || date === 25 || date === 26)) return true;
        if (m === 12 && date === 25) return true;
        if (m === 1 && date === 1) return true;
        if (m === 5 && date === 5) return true;
        return false;
      };

      while (targetDate.getDay() === 0 || targetDate.getDay() === 6 || isHoliday(targetDate)) {
        targetDate.setDate(targetDate.getDate() - 1);
      }
      return targetDate;
    };

    function PaydayApp() {
      // LocalStorage 기반 상태 관리
      const [transactions, setTransactions] = useState(() => {
        const saved = localStorage.getItem('payday_transactions_v4');
        return saved ? JSON.parse(saved) : DEFAULT_TRANSACTIONS;
      });

      const [accounts, setAccounts] = useState(() => {
        const saved = localStorage.getItem('payday_accounts_v4');
        return saved ? JSON.parse(saved) : DEFAULT_ACCOUNTS;
      });

      const [sheetUrl, setSheetUrl] = useState(() => localStorage.getItem('payday_sheet_url') || '');
      const [isSyncing, setIsSyncing] = useState(false);
      const [syncStatus, setSyncStatus] = useState(sheetUrl ? 'connected' : 'local');

      // UI 탭 제어
      const [activeTab, setActiveTab] = useState('MAIN_LIST'); // MAIN_LIST, FIXED_3M, VAR_3M, ENVELOPES, TRENDS
      const [filterCategory, setFilterCategory] = useState('ALL'); // ALL, FIXED, VARIABLE, INCOME
      
      // 모달 및 토스트 상태
      const [showRoutineModal, setShowRoutineModal] = useState(false);
      const [showAccountModal, setShowAccountModal] = useState(false);
      const [showSheetModal, setShowSheetModal] = useState(false);
      const [showAddTxModal, setShowAddTxModal] = useState(false);
      const [deleteConfirmId, setDeleteConfirmId] = useState(null);
      const [toastMessage, setToastMessage] = useState(null);

      // 현재 선택된 년/월 (기본: 2026년 9월)
      const [currentYear, setCurrentYear] = useState(2026);
      const [currentMonth, setCurrentMonth] = useState(9);

      // 토스트 메시지 출력 함수
      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      // 동기화 저장
      useEffect(() => {
        localStorage.setItem('payday_transactions_v4', JSON.stringify(transactions));
      }, [transactions]);

      useEffect(() => {
        localStorage.setItem('payday_accounts_v4', JSON.stringify(accounts));
      }, [accounts]);

      // 급여일 D-Day 산출
      const adjustedPayday = useMemo(() => calculateAdjustedPayday(currentYear, currentMonth), [currentYear, currentMonth]);
      const today = new Date(2026, 8, 11); // 기준일 2026-09-11
      const timeDiff = adjustedPayday.getTime() - today.getTime();
      const dDay = Math.ceil(timeDiff / (1000 * 3600 * 24));

      // 메인 재원 연산식
      const financialSummary = useMemo(() => {
        // 총 수입 (급여 + 월세 등 전체)
        const totalIncome = transactions
          .filter(t => t.type === 'INCOME')
          .reduce((sum, t) => sum + (Number(t.actualAmount) || Number(t.estimatedAmount) || 0), 0);

        // 기본 급여 수입 (월세/임대 수입 제외)
        const baseIncome = transactions
          .filter(t => t.type === 'INCOME' && (t.category === '급여' || t.title.includes('급여') || t.title.includes('기본급')))
          .reduce((sum, t) => sum + (Number(t.actualAmount) || Number(t.estimatedAmount) || 0), 0);

        // 월세 수입 재원
        const rentalIncome = transactions
          .filter(t => t.type === 'INCOME' && (t.category === '월세' || t.title.includes('월세') || t.title.includes('임대')))
          .reduce((sum, t) => sum + (Number(t.actualAmount) || Number(t.estimatedAmount) || 0), 0);

        // 고정 지출 합계
        const fixedExpense = transactions
          .filter(t => t.type === 'EXPENSE' && t.isFixed)
          .reduce((sum, t) => sum + (Number(t.actualAmount) || Number(t.estimatedAmount) || 0), 0);

        // 변동 지출 합계
        const variableExpense = transactions
          .filter(t => t.type === 'EXPENSE' && !t.isFixed)
          .reduce((sum, t) => sum + (Number(t.actualAmount) || Number(t.estimatedAmount) || 0), 0);

        // 필수 선출금 (고정비 + 변동비)
        const totalEssential = fixedExpense + variableExpense;

        // 초과근무재원 = (급여수익 - 필수선출금)
        const overtimeIncome = baseIncome - totalEssential;

        // 자유 운용 재원 = (총 수입 - 필수 선출금)
        const safeToSpend = totalIncome - totalEssential;

        // 이체 완결 현황
        const completedCount = transactions.filter(t => t.isCompleted).length;
        const totalCount = transactions.length;

        return {
          totalIncome,
          baseIncome,
          rentalIncome,
          fixedExpense,
          variableExpense,
          totalEssential,
          overtimeIncome,
          safeToSpend,
          completedCount,
          totalCount
        };
      }, [transactions]);

      const handleSheetSync = async (type = 'EXPORT') => {
        if (!sheetUrl) {
          showToast('구글 시트 Web App URL을 먼저 등록해주세요.');
          setShowSheetModal(true);
          return;
        }

        setIsSyncing(true);
        try {
          if (type === 'EXPORT') {
            await fetch(sheetUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ transactions, accounts }),
            });
            showToast('구글 시트에 성공적으로 동기화되었습니다!');
          } else {
            const response = await fetch(`${sheetUrl}?action=read`);
            const data = await response.json();
            if (data.transactions) setTransactions(data.transactions);
            if (data.accounts) setAccounts(data.accounts);
            showToast('구글 시트에서 최신 데이터를 불러왔습니다.');
          }
          setSyncStatus('connected');
        } catch (err) {
          console.error(err);
          showToast('구글 시트 연동 중 오류가 발생했습니다.');
        } finally {
          setIsSyncing(false);
        }
      };

      const toggleComplete = (id) => {
        setTransactions(prev => prev.map(t => t.id === id ? { ...t, isCompleted: !t.isCompleted } : t));
      };

      const updateAmount = (id, newAmount) => {
        const val = Number(newAmount) || 0;
        setTransactions(prev => prev.map(t => t.id === id ? { ...t, actualAmount: val } : t));
      };

      // 항목 삭제 확정 로직
      const handleConfirmDelete = () => {
        if (deleteConfirmId) {
          setTransactions(prev => prev.filter(t => t.id !== deleteConfirmId));
          setDeleteConfirmId(null);
          showToast('항목이 삭제되었습니다.');
        }
      };

      return (
        <div className="max-w-md mx-auto min-h-screen bg-slate-50 flex flex-col pb-20 border-x border-slate-200 shadow-xl relative">
          {/* Toast Notification Banner */}
          {toastMessage && (
            <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900/90 text-white text-xs px-4 py-2.5 rounded-full shadow-2xl backdrop-blur flex items-center space-x-2 animate-bounce">
              <i className="fa-solid fa-circle-info text-indigo-400"></i>
              <span>{toastMessage}</span>
            </div>
          )}

          {/* Header */}
          <header className="bg-slate-900 text-white p-4 sticky top-0 z-30 shadow-md">
            <div className="flex justify-between items-center">
              <div className="flex items-center space-x-2">
                <div className="w-8 h-8 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-white shadow-inner">
                  <i className="fa-solid fa-wallet text-sm"></i>
                </div>
                <h1 className="font-extrabold text-lg tracking-tight">선출금 자산관리</h1>
              </div>
              
              <div className="flex items-center space-x-2">
                <button 
                  onClick={() => setShowSheetModal(true)}
                  className={`px-2.5 py-1 text-xs rounded-full font-medium flex items-center space-x-1.5 transition-all ${
                    syncStatus === 'connected' ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' : 'bg-slate-800 text-slate-300 border border-slate-700'
                  }`}
                >
                  <i className={`fa-solid ${syncStatus === 'connected' ? 'fa-cloud-check text-emerald-400' : 'fa-cloud-arrow-up'}`}></i>
                  <span>{syncStatus === 'connected' ? '시트연동중' : '시트연동'}</span>
                </button>
              </div>
            </div>

            {/* Payday Banner */}
            <div className="mt-3 bg-slate-800/80 backdrop-blur rounded-xl p-3 border border-slate-700/60 flex justify-between items-center text-xs">
              <div>
                <span className="text-slate-400">이번 달 급여 예정일: </span>
                <span className="font-semibold text-indigo-300">
                  {adjustedPayday.getFullYear()}년 {adjustedPayday.getMonth() + 1}월 {adjustedPayday.getDate()}일
                  {adjustedPayday.getDate() !== 25 && <span className="text-amber-400 ml-1">(휴일 조기지급)</span>}
                </span>
              </div>
              <div className="bg-indigo-600/90 text-white font-bold px-2.5 py-1 rounded-lg shadow-sm">
                D-{dDay > 0 ? dDay : 'DAY'}
              </div>
            </div>
          </header>

          <main className="p-4 space-y-4 flex-1">
            {/* HERO CARD: 이달의 자유 운용 재원 (Soft & Refined Premium Style) */}
            <div className="bg-gradient-to-br from-indigo-50/90 via-slate-50 to-blue-50/80 border border-indigo-100/90 rounded-2xl p-5 shadow-sm relative overflow-hidden">
              <div className="absolute top-0 right-0 w-36 h-36 bg-indigo-500/5 rounded-full blur-2xl -mr-10 -mt-10 pointer-events-none"></div>

              <div className="flex justify-between items-center mb-1">
                <span className="text-[11px] font-bold uppercase tracking-wider text-indigo-600 bg-indigo-100/60 px-2 py-0.5 rounded-md">
                  Pay Yourself First
                </span>
                <button 
                  onClick={() => setShowRoutineModal(true)}
                  className="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition-all flex items-center space-x-1 shadow-sm active:scale-95"
                >
                  <i className="fa-solid fa-wand-magic-sparkles"></i>
                  <span>급여일 3분 루틴</span>
                </button>
              </div>

              <h2 className="text-xs font-semibold text-slate-500 mt-2 mb-0.5">이달의 자유 운용 재원</h2>
              <div className="text-3xl font-black text-slate-900 tracking-tight mb-4">
                {financialSummary.safeToSpend.toLocaleString()} <span className="text-base font-medium text-slate-600">원</span>
              </div>

              {/* Sub Financial Breakdown Box */}
              <div className="bg-white/80 rounded-xl p-3 backdrop-blur border border-slate-200/80 shadow-xs space-y-2">
                <div className="flex justify-between text-xs">
                  <span className="text-slate-600 font-medium">총 수입 (급여+월세)</span>
                  <span className="font-bold text-emerald-600">+{financialSummary.totalIncome.toLocaleString()} 원</span>
                </div>

                {/* Sub Badges for Overtime & Rental Income */}
                <div className="grid grid-cols-2 gap-2 pt-1.5 border-t border-slate-100 text-[11px]">
                  <div className="bg-indigo-50/70 rounded-lg p-2 border border-indigo-100">
                    <div className="text-indigo-700 font-bold mb-0.5 flex items-center space-x-1">
                      <span>⚡ 초과근무재원</span>
                    </div>
                    <div className={`font-extrabold ${financialSummary.overtimeIncome >= 0 ? 'text-indigo-900' : 'text-rose-600'}`}>
                      {financialSummary.overtimeIncome.toLocaleString()}원
                    </div>
                  </div>
                  <div className="bg-emerald-50/70 rounded-lg p-2 border border-emerald-100">
                    <div className="text-emerald-700 font-bold mb-0.5 flex items-center space-x-1">
                      <span>🏠 월세수입재원</span>
                    </div>
                    <div className="font-extrabold text-emerald-900">
                      +{financialSummary.rentalIncome.toLocaleString()}원
                    </div>
                  </div>
                </div>

                <div className="flex justify-between text-xs pt-1 border-t border-slate-100">
                  <span className="text-slate-600 font-medium">필수 선출금 (고정+변동)</span>
                  <span className="font-bold text-rose-500">-{financialSummary.totalEssential.toLocaleString()} 원</span>
                </div>
              </div>

              {/* Progress Bar */}
              <div className="mt-3.5 pt-1">
                <div className="flex justify-between text-[11px] text-slate-500 mb-1">
                  <span>선출금 이체 완결 현황</span>
                  <span className="font-bold text-indigo-700">{financialSummary.completedCount} / {financialSummary.totalCount} 건 ({Math.round((financialSummary.completedCount / (financialSummary.totalCount || 1)) * 100)}%)</span>
                </div>
                <div className="w-full h-2 bg-slate-200/80 rounded-full overflow-hidden">
                  <div 
                    className="h-full bg-indigo-600 transition-all duration-500 rounded-full"
                    style={{ width: `${(financialSummary.completedCount / (financialSummary.totalCount || 1)) * 100}%` }}
                  ></div>
                </div>
              </div>
            </div>

            {/* Navigation Tabs */}
            <div className="flex space-x-1 bg-slate-200/80 p-1 rounded-xl text-xs font-semibold no-scrollbar overflow-x-auto">
              <button 
                onClick={() => setActiveTab('MAIN_LIST')}
                className={`flex-1 min-w-[70px] py-2 rounded-lg text-center transition-all ${activeTab === 'MAIN_LIST' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
              >
                전체 내역
              </button>
              <button 
                onClick={() => setActiveTab('FIXED_3M')}
                className={`flex-1 min-w-[85px] py-2 rounded-lg text-center transition-all ${activeTab === 'FIXED_3M' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
              >
                고정비 3개월
              </button>
              <button 
                onClick={() => setActiveTab('VAR_3M')}
                className={`flex-1 min-w-[85px] py-2 rounded-lg text-center transition-all ${activeTab === 'VAR_3M' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
              >
                변동비 3개월
              </button>
              <button 
                onClick={() => setActiveTab('ENVELOPES')}

                      />
                    </div>
                  ))}
                </div>

                <button 
                  onClick={() => setStep(2)}
                  className="w-full bg-indigo-600 text-white font-bold text-xs py-3 rounded-xl shadow-lg hover:bg-indigo-700 transition-colors"
                >
                  다음: 변동 고지서 입력 →
                </button>
              </div>
            )}

            {/* STEP 2: VARIABLE EXPENSE INPUT */}
            {step === 2 && (
              <div className="space-y-3">
                <p className="text-xs text-slate-500">
                  이번 달 도착한 아파트 관리비, 도시가스, 주유비, 카드 고지서 실금액을 입력해주세요.
                </p>

                <div className="space-y-2 max-h-60 overflow-y-auto">
                  {varExpenseItems.map(item => (
                    <div key={item.id} className="p-3 bg-slate-50 rounded-xl flex justify-between items-center">
                      <div>
                        <div className="font-bold text-slate-800 text-xs">{item.title}</div>
                        <div className="text-[10px] text-slate-400">{item.targetAccount}</div>
                      </div>
                      <input 
                        type="number"
                        value={item.actualAmount}
                        onChange={(e) => updateItemAmount(item.id, e.target.value)}
                        className="w-28 text-right font-extrabold text-sm border border-slate-300 rounded-lg p-1.5 focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>
                  ))}
                </div>

                <div className="flex space-x-2">
                  <button 
                    onClick={() => setStep(1)}
                    className="w-1/3 bg-slate-200 text-slate-700 font-bold text-xs py-3 rounded-xl"
                  >
                    ← 이전
                  </button>
                  <button 
                    onClick={() => setStep(3)}
                    className="w-2/3 bg-indigo-600 text-white font-bold text-xs py-3 rounded-xl shadow-lg hover:bg-indigo-700"
                  >
                    다음: 최종 완결 →
                  </button>
                </div>
              </div>
            )}

            {/* STEP 3: FINAL SUMMARY */}
            {step === 3 && (
              <div className="space-y-4 text-center">
                <div className="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-xl">
                  <i className="fa-solid fa-circle-check"></i>
                </div>

                <div>
                  <h4 className="text-xs text-slate-500">이번 달 차감 후 확정된</h4>
                  <div className="text-2xl font-extrabold text-indigo-900 mt-0.5">
                    이달의 자유 운용 재원
                  </div>
                  <div className="text-3xl font-black text-indigo-600 my-2">
                    {safeToSpend.toLocaleString()} <span className="text-base font-normal">원</span>
                  </div>
                </div>

                <div className="bg-indigo-50 p-3 rounded-xl text-xs text-indigo-900 space-y-1 text-left">
                  <div className="flex justify-between">
                    <span>⚡ 초과근무재원:</span>
                    <span className="font-bold">{overtimeIncome.toLocaleString()}원</span>
                  </div>
                  <div className="text-[10px] text-indigo-600">
                    * 산식: (급여수익 - 필수선출금)
                  </div>
                </div>

                <button 
                  onClick={onClose}
                  className="w-full bg-slate-900 text-white font-bold text-xs py-3 rounded-xl shadow-lg hover:bg-slate-800"
                >
                  루틴 완결 및 메인으로
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // Bank Account Management Modal Component
    function AccountManager({ accounts, setAccounts, onClose }) {
      const [name, setName] = useState('');
      const [note, setNote] = useState('');
      const [startDate, setStartDate] = useState('2024-01-01');

      const addAccount = () => {
        if (!name) return;
        const newAcc = {
          id: 'acc_' + Date.now(),
          name,
          note,
          startDate,
          basePastAccumulated: 0,
          color: 'bg-purple-500'
        };
        setAccounts(prev => [...prev, newAcc]);
        setName('');
        setNote('');
      };

      const deleteAcc = (id) => {
        setAccounts(prev => prev.filter(a => a.id !== id));
      };

      return (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl w-full max-w-sm p-5 shadow-2xl space-y-4">
            <div className="flex justify-between items-center border-b pb-3">
              <h3 className="font-extrabold text-slate-800 text-sm">⚙️ 목적별 통장 관리</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600">
                <i className="fa-solid fa-xmark"></i>
              </button>
            </div>

            <div className="space-y-2 max-h-48 overflow-y-auto">
              {accounts.map(a => (
                <div key={a.id} className="flex justify-between items-center p-2.5 bg-slate-50 rounded-xl text-xs">
                  <div>
                    <div className="font-bold text-slate-800">{a.name}</div>
                    <div className="text-[10px] text-slate-400">{a.note} ({a.startDate || '2024-01-01'} 기산)</div>
                  </div>
                  <button onClick={() => deleteAcc(a.id)} className="text-rose-400 hover:text-rose-600 p-1">
                    <i className="fa-solid fa-trash"></i>
                  </button>
                </div>
              ))}
            </div>

            <div className="pt-2 border-t space-y-2">
              <input 
                type="text" 
                placeholder="통장 이름 (예: 모임비 통장)" 
                value={name} 
                onChange={(e) => setName(e.target.value)}
                className="w-full text-xs p-2.5 border rounded-xl"
              />
              <input 
                type="text" 
                placeholder="용도 설명" 
                value={note} 
                onChange={(e) => setNote(e.target.value)}
                className="w-full text-xs p-2.5 border rounded-xl"
              />
              <div className="space-y-1">
                <label className="text-[10px] font-bold text-slate-500">이체 시작 기산일</label>
                <input 
                  type="date" 
                  value={startDate} 
                  onChange={(e) => setStartDate(e.target.value)}
                  className="w-full text-xs p-2.5 border rounded-xl"
                />
              </div>
              <button 
                onClick={addAccount}
                className="w-full bg-indigo-600 text-white font-bold text-xs py-2.5 rounded-xl"
              >
                + 새 통장 추가
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Google Sheets Sync Modal
    function SheetSyncModal({ sheetUrl, setSheetUrl, onClose, onSync, isSyncing }) {
      const [copied, setCopied] = useState(false);

      const gasScriptCode = `function doGet(e) {
  var sheet = SpreadsheetApp.getActiveSpreadsheet();
  var txSheet = sheet.getSheetByName("Transactions") || sheet.insertSheet("Transactions");
  var accSheet = sheet.getSheetByName("Accounts") || sheet.insertSheet("Accounts");
  
  return ContentService.createTextOutput(JSON.stringify({
    transactions: JSON.parse(txSheet.getRange(1,1).getValue() || "[]"),
    accounts: JSON.parse(accSheet.getRange(1,1).getValue() || "[]")
  })).setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  var data = JSON.parse(e.postData.contents);
  var sheet = SpreadsheetApp.getActiveSpreadsheet();
  var txSheet = sheet.getSheetByName("Transactions") || sheet.insertSheet("Transactions");
  var accSheet = sheet.getSheetByName("Accounts") || sheet.insertSheet("Accounts");
  
  txSheet.getRange(1,1).setValue(JSON.stringify(data.transactions));
  accSheet.getRange(1,1).setValue(JSON.stringify(data.accounts));
  
  return ContentService.createTextOutput("SUCCESS").setMimeType(ContentService.MimeType.TEXT);
}`;

      const copyCode = () => {
        document.execCommand('copy');
        navigator.clipboard?.writeText(gasScriptCode);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      return (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl w-full max-w-sm p-5 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div className="flex justify-between items-center border-b pb-3">
              <h3 className="font-extrabold text-slate-800 text-sm">📊 구글 시트 DB 연동</h3>
              <button onClick={onClose} className="text-slate-400">
                <i className="fa-solid fa-xmark"></i>
              </button>
            </div>

            <div className="space-y-2 text-xs">
              <label className="font-bold text-slate-700">Google Apps Script Web App URL</label>
              <input 
                type="text" 
                placeholder="https://script.google.com/macros/s/.../exec"
                value={sheetUrl}
                onChange={(e) => setSheetUrl(e.target.value)}
                className="w-full border p-2.5 rounded-xl text-xs"
              />
            </div>

            <button 
              onClick={copyCode}
              className="w-full bg-slate-800 text-white font-bold text-xs py-2 rounded-xl flex items-center justify-center space-x-1"
            >
              <i className="fa-regular fa-copy"></i>
              <span>{copied ? '스크립트 코드 복사됨!' : '📋 Apps Script 코드 복사'}</span>
            </button>

            <div className="grid grid-cols-2 gap-2 pt-2 border-t">
              <button 
                onClick={() => onSync('IMPORT')}
                disabled={isSyncing}
                className="bg-emerald-600 text-white font-bold text-xs py-2.5 rounded-xl shadow"
              >
                📥 시트에서 불러오기
              </button>
              <button 
                onClick={() => onSync('EXPORT')}
                disabled={isSyncing}
                className="bg-indigo-600 text-white font-bold text-xs py-2.5 rounded-xl shadow"
              >
                📤 시트로 내보내기
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Add Transaction Modal
    function AddTransactionModal({ accounts, onAdd, onClose }) {
      const [type, setType] = useState('EXPENSE');
      const [isFixed, setIsFixed] = useState(false);
      const [title, setTitle] = useState('');
      const [category, setCategory] = useState('공과금');
      const [amount, setAmount] = useState('');
      const [targetAccount, setTargetAccount] = useState(accounts[0]?.name || '공과금 통장');
      const [dueDay, setDueDay] = useState(25);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!title || !amount) return;
        onAdd({
          id: 'tx_' + Date.now(),
          type,
          isFixed,
          category,
          title,
          estimatedAmount: Number(amount),
          actualAmount: Number(amount),
          targetAccount,
          dueDay: Number(dueDay),
          isCompleted: false,
          history: {}
        });
      };

      return (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <form onSubmit={handleSubmit} className="bg-white rounded-2xl w-full max-w-sm p-5 shadow-2xl space-y-3">
            <div className="flex justify-between items-center border-b pb-2">
              <h3 className="font-extrabold text-slate-800 text-sm">➕ 새 항목 추가</h3>
              <button type="button" onClick={onClose} className="text-slate-400">
                <i className="fa-solid fa-xmark"></i>
              </button>
            </div>

            <div className="grid grid-cols-2 gap-2 text-xs">
              <button 
                type="button" 
                onClick={() => setType('EXPENSE')} 
                className={`py-2 rounded-lg font-bold ${type === 'EXPENSE' ? 'bg-rose-500 text-white' : 'bg-slate-100 text-slate-600'}`}
              >
                지출 (EXPENSE)
              </button>
              <button 
                type="button" 
                onClick={() => setType('INCOME')} 
                className={`py-2 rounded-lg font-bold ${type === 'INCOME' ? 'bg-emerald-500 text-white' : 'bg-slate-100 text-slate-600'}`}
              >
                수입 (INCOME)
              </button>
            </div>

            {type === 'EXPENSE' && (
              <div className="flex items-center space-x-2 text-xs py-1">
                <input 
                  type="checkbox" 
                  id="fixedCheck" 
                  checked={isFixed} 
                  onChange={(e) => setIsFixed(e.target.checked)} 
                  className="rounded text-indigo-600"
                />
                <label htmlFor="fixedCheck" className="font-semibold text-slate-700">고정비 여부 (체크 시 매달 정액)</label>
              </div>
            )}

            <input 
              type="text" 
              placeholder="항목명 (예: 관리비, 주유비, 보험료)" 
              value={title} 
              onChange={(e) => setTitle(e.target.value)} 
              className="w-full border p-2.5 rounded-xl text-xs" 
              required 
            />

            <div className="grid grid-cols-2 gap-2">
              <input 
                type="number" 
                placeholder="금액 (원)" 
                value={amount} 
                onChange={(e) => setAmount(e.target.value)} 
                className="border p-2.5 rounded-xl text-xs" 
                required 
              />
              <input 
                type="number" 
                placeholder="출금예정일 (1~31)" 
                value={dueDay} 
                onChange={(e) => setDueDay(e.target.value)} 
                className="border p-2.5 rounded-xl text-xs" 
                required 
              />
            </div>

            <div className="space-y-1">
              <label className="text-[11px] font-bold text-slate-600">목적 통장 선택</label>
              <select 
                value={targetAccount} 
                onChange={(e) => setTargetAccount(e.target.value)}
                className="w-full border p-2.5 rounded-xl text-xs bg-white"
              >
                {accounts.map(a => (
                  <option key={a.id} value={a.name}>{a.name}</option>
                ))}
              </select>
            </div>

            <button 
              type="submit" 
              className="w-full bg-indigo-600 text-white font-bold text-xs py-3 rounded-xl shadow-lg mt-2"
            >
              항목 추가하기
            </button>
          </form>
        </div>
      );
    }

    // Chart.js Component for Trend Tab (Fuel, Gas, Management Fees)
    function TrendChart() {
      const canvasRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current) return;
        const ctx = canvasRef.current.getContext('2d');

        const chart = new Chart(ctx, {
          type: 'line',
          data: {
            labels: ['4월', '5월', '6월', '7월', '8월', '9월'],
            datasets: [
              {
                label: '아파트 관리비',
                data: [195000, 180000, 182000, 185000, 240000, 215000],
                borderColor: '#6366f1',
                backgroundColor: 'rgba(99, 102, 241, 0.1)',
                tension: 0.3,
                fill: true
              },
              {
                label: '도시가스',
                data: [65000, 32000, 21000, 18000, 16000, 28000],
                borderColor: '#f59e0b',
                tension: 0.3
              },
              {
                label: '차량 주유비',
                data: [150000, 145000, 160000, 140000, 150000, 160000],
                borderColor: '#eab308',
                borderDash: [5, 5],
                tension: 0.3
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } }
            },
            scales: {
              y: { ticks: { font: { size: 9 } } },
              x: { ticks: { font: { size: 9 } } }
            }
          }
        });

        return () => chart.destroy();
      }, []);

      return (
        <div className="h-56 w-full">
          <canvas ref={canvasRef}></canvas>
        </div>
      );
    }

    window.onload = function() {
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<PaydayApp />);
    };
  </script>
</body>
