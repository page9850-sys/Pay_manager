<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>급여일 선출금 자산 관리 앱</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 & ReactDOM 18 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone for JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Chart.js for trends -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="text-slate-800 antialiased selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // 💡 [깃허브 배포용 설정] 아래 따옴표 안에 작성하신 Google Apps Script Web App URL을 붙여넣으시면
    // 앱 시작 시 자동 데이터 로드 및 내용 변경 시 실시간 자동 백업이 상시 작동합니다.
    const DEFAULT_SHEET_URL = "https://script.google.com/macros/s/AKfycbycIVEh0BeZiGXT2dRAjDEg3wZgxs5tYVItC7PQW2mThCiYdW4fimhZMUfmNCywUrOg/exec"; 

    // 안전한 로컬스토리지 입출력 헬퍼
    const safeStorage = {
      getItem: (key, fallback) => {
        try {
          const val = localStorage.getItem(key);
          return val ? JSON.parse(val) : fallback;
        } catch (e) {
          console.warn('LocalStorage read error:', e);
          return fallback;
        }
      },
      setItem: (key, value) => {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch (e) {
          console.warn('LocalStorage write error:', e);
        }
      }
    };

    // 원래의 8개 통장 리스트 구성 복원
    const DEFAULT_ACCOUNTS = [
      { id: 'acc_1', name: '고정비 통장', color: 'bg-indigo-500', note: '보험료, 대출이자, 구독료, 공과금', isAccumulating: false },
      { id: 'acc_2', name: '투자비 통장', color: 'bg-blue-600', note: '노후대비 투자재원 마련, 주식/ETF', isAccumulating: true, startDate: '2025-01-01' },
      { id: 'acc_3', name: '연금저축 통장', color: 'bg-purple-600', note: '개인연금저축 재원 마련', isAccumulating: true, startDate: '2024-01-01' },
      { id: 'acc_4', name: '용돈 통장', color: 'bg-emerald-500', note: '개인 자율 용돈 지출', isAccumulating: false },
      { id: 'acc_5', name: '생활비 통장', color: 'bg-amber-500', note: '장보기, 생활용품, 신용카드 결제', isAccumulating: false },
      { id: 'acc_6', name: '외식비 통장', color: 'bg-rose-500', note: '외식 및 식비 지출', isAccumulating: false },
      { id: 'acc_7', name: '초과근무 통장', color: 'bg-cyan-600', note: '초과근무재원, 수당 자동 집계', isAccumulating: true, startDate: '2026-01-01' },
      { id: 'acc_8', name: '우리은행 통장', color: 'bg-slate-700', note: '기본 급여 수령 및 주거래 계좌', isAccumulating: false },
    ];

    const DEFAULT_TRANSACTIONS = [
      // 수입 (INCOME)
      { id: 'tx_1', type: 'INCOME', isFixed: true, category: '급여', title: '기본 급여 수입', estimatedAmount: 6516000, actualAmount: 6516000, targetAccount: '우리은행 통장', isCompleted: true, history: { '2026-09': 6516000 } },
      { id: 'tx_2', type: 'INCOME', isFixed: false, category: '월세', title: '월세 임대 수입', estimatedAmount: 911000, actualAmount: 911000, targetAccount: '우리은행 통장', isCompleted: false, history: { '2026-09': 911000 } },
      { id: 'tx_bonus', type: 'INCOME', isFixed: false, category: '상여금', title: '설/추석 명절 상여금', estimatedAmount: 0, actualAmount: 0, targetAccount: '투자비 통장', isCompleted: false, history: { '2026-09': 0 } },
      { id: 'tx_incentive', type: 'INCOME', isFixed: false, category: '인센티브', title: '비정기 성과급/인센티브', estimatedAmount: 0, actualAmount: 0, targetAccount: '투자비 통장', isCompleted: false, history: { '2026-09': 0 } },
      
      // 투자 (INVESTMENT)
      { id: 'tx_inv1', type: 'INVESTMENT', isFixed: true, category: '연금', title: '개인연금저축 펀드', estimatedAmount: 500000, actualAmount: 500000, targetAccount: '연금저축 통장', isCompleted: true, history: { '2026-09': 500000 } },
      { id: 'tx_inv2', type: 'INVESTMENT', isFixed: true, category: '저축', title: '노후대비 투자바', estimatedAmount: 3000000, actualAmount: 3000000, targetAccount: '투자비 통장', isCompleted: false, history: { '2026-09': 3000000 } },

      // 고정 지출 (EXPENSE - FIXED)
      { id: 'tx_3', type: 'EXPENSE', isFixed: true, category: '보험료', title: '실손/건강 보험료', estimatedAmount: 180000, actualAmount: 180000, targetAccount: '고정비 통장', isCompleted: false, history: { '2026-09': 180000 } },
      { id: 'tx_4', type: 'EXPENSE', isFixed: true, category: '대출이자', title: '주택담보대출 이자', estimatedAmount: 420000, actualAmount: 420000, targetAccount: '고정비 통장', isCompleted: false, history: { '2026-09': 420000 } },
      
      // 변동 지출 (EXPENSE - VARIABLE)
      { id: 'tx_7', type: 'EXPENSE', isFixed: false, category: '관리비', title: '아파트 관리비', estimatedAmount: 190000, actualAmount: 215000, targetAccount: '고정비 통장', isCompleted: false, history: { '2026-09': 215000 } },
      { id: 'tx_10', type: 'EXPENSE', isFixed: false, category: '카드대금', title: '생활비 신용카드 대금', estimatedAmount: 800000, actualAmount: 850000, targetAccount: '생활비 통장', isCompleted: false, history: { '2026-09': 850000 } },
    ];

    const calculateAdjustedPayday = (year, month) => {
      let targetDate = new Date(year, month - 1, 25);
      const isHoliday = (d) => {
        const m = d.getMonth() + 1;
        const date = d.getDate();
        if (m === 9 && (date === 24 || date === 25 || date === 26)) return true;
        if (m === 12 && date === 25) return true;
        if (m === 1 && date === 1) return true;
        if (m === 5 && date === 5) return true;
        return false;
      };
      while (targetDate.getDay() === 0 || targetDate.getDay() === 6 || isHoliday(targetDate)) {
        targetDate.setDate(targetDate.getDate() - 1);
      }
      return targetDate;
    };

    function PaydayApp() {
      const [transactions, setTransactions] = useState(() => safeStorage.getItem('payday_transactions_v11', DEFAULT_TRANSACTIONS));
      const [accounts, setAccounts] = useState(() => safeStorage.getItem('payday_accounts_v11', DEFAULT_ACCOUNTS));
      const [sheetUrl, setSheetUrl] = useState(() => {
        try {
          return localStorage.getItem('payday_sheet_url') || DEFAULT_SHEET_URL;
        } catch(e) {
          return DEFAULT_SHEET_URL;
        }
      });

      const [isSyncing, setIsSyncing] = useState(false);
      const [syncStatus, setSyncStatus] = useState(sheetUrl ? 'connected' : 'local');

      // UI 탭 및 필터
      const [activeTab, setActiveTab] = useState('MAIN_LIST');
      const [filterCategory, setFilterCategory] = useState('ALL');
      const [batchSelectedIds, setBatchSelectedIds] = useState([]);

      // 모달 및 토스트
      const [showRoutineModal, setShowRoutineModal] = useState(false);
      const [showAccountModal, setShowAccountModal] = useState(false);
      const [showSheetModal, setShowSheetModal] = useState(false);
      const [showAddTxModal, setShowAddTxModal] = useState(false);
      const [editTx, setEditTx] = useState(null);
      const [deleteConfirmId, setDeleteConfirmId] = useState(null);
      const [toastMessage, setToastMessage] = useState(null);

      // 선택 연월 (기본: 2026년 9월)
      const [currentYear, setCurrentYear] = useState(2026);
      const [currentMonth, setCurrentMonth] = useState(9);

      const isInitialMount = useRef(true);

      const handlePrevMonth = () => {
        if (currentMonth === 1) {
          setCurrentYear(prev => prev - 1);
          setCurrentMonth(12);
        } else {
          setCurrentMonth(prev => prev - 1);
        }
      };

      const handleNextMonth = () => {
        if (currentMonth === 12) {
          setCurrentYear(prev => prev + 1);
          setCurrentMonth(1);
        } else {
          setCurrentMonth(prev => prev + 1);
        }
      };

      const handleCurrentMonth = () => {
        setCurrentYear(2026);
        setCurrentMonth(9);
      };

      const monthKey = useMemo(() => `${currentYear}-${String(currentMonth).padStart(2, '0')}`, [currentYear, currentMonth]);

      // 비정기 수입/투자 항목 판별 함수 (상여금, 인센티브, 명절보너스 등)
      const isIrregularTx = (t) => {
        if (!t) return false;
        const cat = t.category || '';
        const title = t.title || '';
        return cat === '상여금' || cat === '인센티브' || 
               title.includes('상여금') || title.includes('인센티브') || 
               title.includes('보너스') || title.includes('성과급');
      };

      // 월별 금액 연산 헬퍼 (월별 데이터 독립성 보장)
      const getTxAmountForMonth = (t, ym) => {
        // 해당 월에 명시적인 수정/기록 내역이 있는 경우
        if (t.history && t.history[ym] !== undefined) {
          return Number(t.history[ym]) || 0;
        }
        // 현재 선택한 연월인 경우
        if (ym === monthKey) {
          return Number(t.actualAmount) || Number(t.estimatedAmount) || 0;
        }
        // 비정기 항목(상여금, 인센티브)은 명시적 기록이 없는 과거/미래 달에는 0원 처리
        if (isIrregularTx(t)) {
          return 0;
        }
        // 일반 고정 정액 항목인 경우에만 기본 금액 반환
        if (t.isFixed) {
          return Number(t.estimatedAmount) || Number(t.actualAmount) || 0;
        }
        return 0;
      };

      const getTxAmount = (t) => getTxAmountForMonth(t, monthKey);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      const getMonthFinancials = (ym) => {
        const totalInc = transactions
          .filter(t => t.type === 'INCOME')
          .reduce((sum, t) => sum + getTxAmountForMonth(t, ym), 0);

        const rentalInc = transactions
          .filter(t => t.type === 'INCOME' && (t.category === '월세' || t.title.includes('월세') || t.title.includes('임대')))
          .reduce((sum, t) => sum + getTxAmountForMonth(t, ym), 0);

        const bonusInc = transactions
          .filter(t => t.type === 'INCOME' && (t.category === '상여금' || t.title.includes('상여금') || t.title.includes('보너스')))
          .reduce((sum, t) => sum + getTxAmountForMonth(t, ym), 0);

        const incentiveInc = transactions
          .filter(t => t.type === 'INCOME' && (t.category === '인센티브' || t.title.includes('인센티브') || t.title.includes('성과급')))
          .reduce((sum, t) => sum + getTxAmountForMonth(t, ym), 0);

        const baseInc = transactions
          .filter(t => t.type === 'INCOME' && !(
            t.category === '월세' || t.title.includes('월세') || t.title.includes('임대') ||
            t.category === '상여금' || t.title.includes('상여금') || t.title.includes('보너스') ||
            t.category === '인센티브' || t.title.includes('인센티브') || t.title.includes('성과급')
          ))
          .reduce((sum, t) => sum + getTxAmountForMonth(t, ym), 0);

        const fixedExp = transactions
          .filter(t => t.type === 'EXPENSE' && t.isFixed)
          .reduce((sum, t) => sum + getTxAmountForMonth(t, ym), 0);

        const varExp = transactions
          .filter(t => t.type === 'EXPENSE' && !t.isFixed)
          .reduce((sum, t) => sum + getTxAmountForMonth(t, ym), 0);

        const invTotal = transactions
          .filter(t => t.type === 'INVESTMENT')
          .reduce((sum, t) => sum + getTxAmountForMonth(t, ym), 0);

        const essential = fixedExp + varExp + invTotal;
        const overtime = baseInc - essential;
        const safe = totalInc - essential;

        return {
          totalIncome: totalInc,
          baseIncome: baseInc,
          rentalIncome: rentalInc,
          bonusIncome: bonusInc,
          incentiveIncome: incentiveInc,
          fixedExpense: fixedExp,
          variableExpense: varExp,
          investmentTotal: invTotal,
          totalEssential: essential,
          overtimeIncome: overtime,
          safeToSpend: safe
        };
      };

      const handleSheetSync = async (type = 'EXPORT', quiet = false) => {
        if (!sheetUrl) {
          if (!quiet) {
            showToast('구글 시트 Web App URL을 등록해주세요.');
            setShowSheetModal(true);
          }
          return;
        }

        if (!quiet) setIsSyncing(true);
        try {
          if (type === 'EXPORT') {
            await fetch(sheetUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ transactions, accounts }),
              redirect: 'follow',
            });
            if (!quiet) showToast('구글 시트에 성공적으로 동기화되었습니다!');
          } else {
            const response = await fetch(`${sheetUrl}?action=read`, { redirect: 'follow' });
            const data = await response.json();
            if (data.transactions && Array.isArray(data.transactions) && data.transactions.length > 0) {
              setTransactions(data.transactions);
            }
            if (data.accounts && Array.isArray(data.accounts) && data.accounts.length > 0) {
              setAccounts(data.accounts);
            }
            if (!quiet) showToast('구글 시트에서 최신 데이터를 불러왔습니다.');
          }
          setSyncStatus('connected');
        } catch (err) {
          console.error('Sheet Sync Error:', err);
          if (!quiet) showToast('구글 시트 연동 오류! 배포 설정을 확인하세요.');
        } finally {
          if (!quiet) setIsSyncing(false);
        }
      };

      useEffect(() => {
        if (sheetUrl && sheetUrl.startsWith('http')) {
          handleSheetSync('IMPORT', true);
        }
      }, []);

      useEffect(() => {
        safeStorage.setItem('payday_transactions_v11', transactions);
        safeStorage.setItem('payday_accounts_v11', accounts);

        if (!isInitialMount.current && sheetUrl && sheetUrl.startsWith('http')) {
          const timer = setTimeout(() => {
            handleSheetSync('EXPORT', true);
          }, 2000);
          return () => clearTimeout(timer);
        } else {
          isInitialMount.current = false;
        }
      }, [transactions, accounts]);

      useEffect(() => {
        if (sheetUrl) {
          try { localStorage.setItem('payday_sheet_url', sheetUrl); } catch(e){}
          setSyncStatus('connected');
        }
      }, [sheetUrl]);

      const adjustedPayday = useMemo(() => calculateAdjustedPayday(currentYear, currentMonth), [currentYear, currentMonth]);
      const today = new Date(2026, 8, 23);
      const timeDiff = adjustedPayday.getTime() - today.getTime();
      const dDay = Math.ceil(timeDiff / (1000 * 3600 * 24));

      const financialSummary = useMemo(() => {
        const curFin = getMonthFinancials(monthKey);
        const completedCount = transactions.filter(t => t.isCompleted).length;
        const totalCount = transactions.length;

        return {
          ...curFin,
          completedCount,
          totalCount
        };
      }, [transactions, monthKey]);

      const toggleComplete = (id) => {
        setTransactions(prev => prev.map(t => t.id === id ? { ...t, isCompleted: !t.isCompleted } : t));
      };

      const toggleBatchSelect = (id) => {
        setBatchSelectedIds(prev => 
          prev.includes(id) ? prev.filter(item => item !== id) : [...prev, id]
        );
      };

      const updateAmount = (id, newAmount) => {
        const val = Number(newAmount) || 0;
        setTransactions(prev => prev.map(t => {
          if (t.id === id) {
            const updatedHistory = { ...(t.history || {}), [monthKey]: val };
            return { ...t, actualAmount: val, history: updatedHistory };
          }
          return t;
        }));
      };

      const handleConfirmDelete = () => {
        if (deleteConfirmId) {
          setTransactions(prev => prev.filter(t => t.id !== deleteConfirmId));
          setDeleteConfirmId(null);
          showToast('항목이 삭제되었습니다.');
        }
      };

      const m3 = { y: currentYear, m: currentMonth };
      const m2 = currentMonth > 1 ? { y: currentYear, m: currentMonth - 1 } : { y: currentYear - 1, m: 12 };
      const m1 = m2.m > 1 ? { y: m2.y, m: m2.m - 1 } : { y: m2.y - 1, m: 12 };

      const m1Key = `${m1.y}-${String(m1.m).padStart(2, '0')}`;
      const m2Key = `${m2.y}-${String(m2.m).padStart(2, '0')}`;
      const m3Key = `${m3.y}-${String(m3.m).padStart(2, '0')}`;

      const filteredTransactions = useMemo(() => {
        return transactions.filter(t => {
          if (filterCategory === 'FIXED') return t.type === 'EXPENSE' && t.isFixed;
          if (filterCategory === 'VARIABLE') return t.type === 'EXPENSE' && !t.isFixed;
          if (filterCategory === 'INVESTMENT') return t.type === 'INVESTMENT';
          if (filterCategory === 'INCOME') return t.type === 'INCOME';
          return true;
        });
      }, [transactions, filterCategory]);

      const batchSelectedSum = useMemo(() => {
        return filteredTransactions
          .filter(t => batchSelectedIds.includes(t.id))
          .reduce((sum, t) => sum + getTxAmount(t), 0);
      }, [filteredTransactions, batchSelectedIds, monthKey]);

      const batchSelectedCount = useMemo(() => {
        return filteredTransactions.filter(t => batchSelectedIds.includes(t.id)).length;
      }, [filteredTransactions, batchSelectedIds]);

      return (
        <div className="max-w-md mx-auto min-h-screen bg-slate-50 flex flex-col pb-20 border-x border-slate-200 shadow-xl relative">
          {toastMessage && (
            <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900/90 text-white text-xs px-4 py-2.5 rounded-full shadow-2xl backdrop-blur flex items-center space-x-2 animate-bounce">
              <i className="fa-solid fa-circle-info text-indigo-400"></i>
              <span>{toastMessage}</span>
            </div>
          )}

          {/* Header */}
          <header className="bg-slate-900 text-white p-4 sticky top-0 z-30 shadow-md">
            <div className="flex justify-between items-center">
              <div className="flex items-center space-x-2">
                <div className="w-8 h-8 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-white shadow-inner">
                  <i className="fa-solid fa-wallet text-sm"></i>
                </div>
                <h1 className="font-extrabold text-lg tracking-tight">선출금 자산관리</h1>
              </div>
              
              <div className="flex items-center space-x-2">
                <button 
                  onClick={() => setShowSheetModal(true)}
                  className={`px-2.5 py-1 text-xs rounded-full font-medium flex items-center space-x-1.5 transition-all ${
                    syncStatus === 'connected' ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' : 'bg-slate-800 text-slate-300 border border-slate-700'
                  }`}
                >
                  <i className={`fa-solid ${syncStatus === 'connected' ? 'fa-cloud-check text-emerald-400' : 'fa-cloud-arrow-up'}`}></i>
                  <span>{syncStatus === 'connected' ? '시트상시연동' : '시트연동'}</span>
                </button>
              </div>
            </div>

            <div className="mt-3 bg-slate-800/80 backdrop-blur rounded-xl p-3 border border-slate-700/60 flex justify-between items-center text-xs">
              <div>
                <span className="text-slate-400">급여 예정일: </span>
                <span className="font-semibold text-indigo-300">
                  {adjustedPayday.getFullYear()}년 {adjustedPayday.getMonth() + 1}월 {adjustedPayday.getDate()}일
                  {adjustedPayday.getDate() !== 25 && <span className="text-amber-400 ml-1">(휴일 조기지급)</span>}
                </span>
              </div>
              <div className="bg-indigo-600/90 text-white font-bold px-2.5 py-1 rounded-lg shadow-sm">
                D-{dDay > 0 ? dDay : 'DAY'}
              </div>
            </div>
          </header>

    function RoutineWizard({ transactions, setTransactions, onClose, safeToSpend, overtimeIncome, currentMonth, monthKey }) {

        const num = Number(val) || 0;
        setTransactions(prev => prev.map(t => {
          if (t.id === id) {
            const updatedHistory = { ...(t.history || {}), [monthKey]: num };
            return { ...t, actualAmount: num, history: updatedHistory };
          }
          return t;
        }));
      };

      return (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">

                  {step === 1 && '1단계: 이번 달 수입 확정'}

                  다음: 변동 고지서 입력 →
                </button>
              </div>
            )}

            {step === 2 && (
              <div className="space-y-3">
                <p className="text-xs text-slate-500">
                  이번 달 도착한 아파트 관리비, 도시가스, 주유비, 카드 고지서 실금액을 입력해주세요.

                <div className="space-y-2 max-h-60 overflow-y-auto">

                      />

                  ))}
                </div>

                <div className="flex space-x-2">
                  <button 
                    onClick={() => setStep(1)}
                    className="w-1/3 bg-slate-200 text-slate-700 font-bold text-xs py-3 rounded-xl"

    function AccountManager({ accounts, setAccounts, onClose }) {

      const addAccount = () => {

        const newAcc = {
          id: 'acc_' + Date.now(),
          name,
          note,
          isAccumulating,
          startDate: isAccumulating ? startDate : undefined,
          color: 'bg-purple-500'
        };
        setAccounts(prev => [...prev, newAcc]);
        setName('');
        setNote('');
      };

      const deleteAcc = (id) => {
        setAccounts(prev => prev.filter(a => a.id !== id));
      };

      return (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl w-full max-w-sm p-5 shadow-2xl space-y-4">
            <div className="flex justify-between items-center border-b pb-3">
              <h3 className="font-extrabold text-slate-800 text-sm">⚙️ 목적별 통장 관리</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600">
                <i className="fa-solid fa-xmark"></i>

            <div className="space-y-2 max-h-48 overflow-y-auto">

                  <div>
                    <div className="font-bold text-slate-800">{a.name}</div>
                    <div className="text-[10px] text-slate-400">
                      {a.note} {a.isAccumulating ? `(${a.startDate} 기산 누적)` : '(소비용)'}

                  <button onClick={() => deleteAcc(a.id)} className="text-rose-400 hover:text-rose-600 p-1">

              ))}

            <div className="pt-2 border-t space-y-2 text-xs">
              <input 
                type="text" 
                placeholder="통장 이름 (예: 연금저축 통장)"

                onChange={(e) => setName(e.target.value)}
                className="w-full text-xs p-2.5 border rounded-xl"
              />
              <input 
                type="text" 
                placeholder="용도 설명" 
                value={note} 
                onChange={(e) => setNote(e.target.value)}
                className="w-full text-xs p-2.5 border rounded-xl"
              />

              <div className="flex items-center justify-between p-2 bg-slate-50 rounded-xl">

              {isAccumulating && (
                <div className="space-y-1">
                  <label className="text-[10px] font-bold text-slate-500">누적 기산 시작일</label>

        </div>
      );

    function SheetSyncModal({ sheetUrl, setSheetUrl, onClose, onSync, isSyncing }) {
      const [copied, setCopied] = useState(false);

      const gasScriptCode = `function doGet(e) {
  var sheet = SpreadsheetApp.getActiveSpreadsheet();
  var txSheet = sheet.getSheetByName("Transactions") || sheet.insertSheet("Transactions");
  var accSheet = sheet.getSheetByName("Accounts") || sheet.insertSheet("Accounts");
  
  return ContentService.createTextOutput(JSON.stringify({
    transactions: JSON.parse(txSheet.getRange(1,1).getValue() || "[]"),
    accounts: JSON.parse(accSheet.getRange(1,1).getValue() || "[]")
  })).setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  var postDataString = e.postData ? e.postData.contents : "";
  var data = JSON.parse(postDataString || "{}");
  var sheet = SpreadsheetApp.getActiveSpreadsheet();
  var txSheet = sheet.getSheetByName("Transactions") || sheet.insertSheet("Transactions");
  var accSheet = sheet.getSheetByName("Accounts") || sheet.insertSheet("Accounts");
  
  if (data.transactions) txSheet.getRange(1,1).setValue(JSON.stringify(data.transactions));
  if (data.accounts) accSheet.getRange(1,1).setValue(JSON.stringify(data.accounts));
  
  return ContentService.createTextOutput("SUCCESS").setMimeType(ContentService.MimeType.TEXT);
}`;

      const copyCode = () => {
        try {
          navigator.clipboard?.writeText(gasScriptCode);
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        } catch(e) {
          alert('스크립트 복사에 실패했습니다.');
        }
      };

      return (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl w-full max-w-sm p-5 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div className="flex justify-between items-center border-b pb-3">
              <h3 className="font-extrabold text-slate-800 text-sm">📊 구글 시트 DB 상시 연동</h3>
              <button onClick={onClose} className="text-slate-400">
                <i className="fa-solid fa-xmark"></i>
              </button>
            </div>

            <div className="space-y-2 text-xs">
              <label className="font-bold text-slate-700">Google Apps Script Web App URL</label>
              <input 
                type="text" 
                placeholder="https://script.google.com/macros/s/.../exec"
                value={sheetUrl}
                onChange={(e) => setSheetUrl(e.target.value.trim())}
                className="w-full border p-2.5 rounded-xl text-xs font-mono"
              />
            </div>

            <div className="bg-amber-50 border border-amber-200 rounded-xl p-2.5 text-[11px] text-amber-900 space-y-1">
              <div className="font-bold text-amber-800 flex items-center space-x-1">
                <i className="fa-solid fa-triangle-exclamation"></i>
                <span>배포 필수 설정 (오류 방지)</span>
              </div>
              <p>1. <b>웹앱으로 배포</b> ➔ 실행 사용자: <b>내 계정</b></p>
              <p>2. 액세스 권한: <b>모든 사용자(Anyone)</b>로 설정해야 CORS 에러가 없습니다.</p>
              <p>3. 💡 URL 등록 시 내용 변경 시 <b>상시 자동 백업</b>됩니다.</p>
            </div>

            <button 
              onClick={copyCode}
              className="w-full bg-slate-800 text-white font-bold text-xs py-2 rounded-xl flex items-center justify-center space-x-1"
            >
              <i className="fa-regular fa-copy"></i>
              <span>{copied ? '스크립트 코드 복사됨!' : '📋 Apps Script 코드 복사'}</span>
            </button>

            <div className="grid grid-cols-2 gap-2 pt-2 border-t">
              <button 
                onClick={() => onSync('IMPORT', false)}
                disabled={isSyncing}
                className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs py-2.5 rounded-xl shadow transition-colors"
              >
                {isSyncing ? '동기화 중...' : '📥 시트에서 불러오기'}
              </button>
              <button 
                onClick={() => onSync('EXPORT', false)}
                disabled={isSyncing}
                className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs py-2.5 rounded-xl shadow transition-colors"
              >
                {isSyncing ? '동기화 중...' : '📤 시트로 내보내기'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function AddTransactionModal({ accounts, onAdd, onClose }) {
      const [type, setType] = useState('EXPENSE');
      const [isFixed, setIsFixed] = useState(true);
      const [title, setTitle] = useState('');
      const [category, setCategory] = useState('공과금');
      const [amount, setAmount] = useState('');
      const [targetAccount, setTargetAccount] = useState(accounts[0]?.name || '고정비 통장');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!title || !amount) return;
        onAdd({
          id: 'tx_' + Date.now(),
          type,
          isFixed: (type === 'EXPENSE' || type === 'INVESTMENT') ? isFixed : true,
          category,
          title,
          estimatedAmount: Number(amount),
          actualAmount: Number(amount),
          targetAccount,
          isCompleted: false,
          history: {}
        });
      };

      return (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <form onSubmit={handleSubmit} className="bg-white rounded-2xl w-full max-w-sm p-5 shadow-2xl space-y-3">
            <div className="flex justify-between items-center border-b pb-2">
              <h3 className="font-extrabold text-slate-800 text-sm">➕ 새 항목 추가</h3>
              <button type="button" onClick={onClose} className="text-slate-400">
                <i className="fa-solid fa-xmark"></i>
              </button>
            </div>

            <div className="grid grid-cols-3 gap-1.5 text-xs">
              <button 
                type="button" 
                onClick={() => { setType('EXPENSE'); setCategory('공과금'); }} 
                className={`py-2 rounded-lg font-bold ${type === 'EXPENSE' ? 'bg-rose-500 text-white' : 'bg-slate-100 text-slate-600'}`}
              >
                지출
              </button>
              <button 
                type="button" 
                onClick={() => { setType('INVESTMENT'); setCategory('투자'); }} 
                className={`py-2 rounded-lg font-bold ${type === 'INVESTMENT' ? 'bg-purple-600 text-white' : 'bg-slate-100 text-slate-600'}`}
              >
                투자
              </button>
              <button 
                type="button" 
                onClick={() => { setType('INCOME'); setCategory('급여'); }} 
                className={`py-2 rounded-lg font-bold ${type === 'INCOME' ? 'bg-emerald-500 text-white' : 'bg-slate-100 text-slate-600'}`}
              >
                수입
              </button>
            </div>

            {type === 'INCOME' && (
              <div className="space-y-1">
                <label className="text-[11px] font-bold text-slate-600">수입 세부 구분</label>
                <select 
                  value={category} 
                  onChange={(e) => setCategory(e.target.value)}
                  className="w-full border p-2.5 rounded-xl text-xs bg-white"
                >
                  <option value="급여">기본 급여</option>
                  <option value="월세">월세 임대 수입</option>
                  <option value="상여금">명절 상여금 (초과근무 제외)</option>
                  <option value="인센티브">비정기 인센티브/성과급 (초과근무 제외)</option>
                  <option value="기타">기타 수입</option>
                </select>
              </div>
            )}

            {(type === 'EXPENSE' || type === 'INVESTMENT') && (
              <div className="flex items-center space-x-2 text-xs py-1">
                <input 
                  type="checkbox" 
                  id="fixedCheck" 
                  checked={isFixed} 
                  onChange={(e) => setIsFixed(e.target.checked)} 
                  className="rounded text-indigo-600"
                />
                <label htmlFor="fixedCheck" className="font-semibold text-slate-700">
                  {type === 'INVESTMENT' ? '고정 투자 여부 (매달 정액 적립/투자)' : '고정비 여부 (체크 시 매달 정액)'}
                </label>
              </div>
            )}

            <input 
              type="text" 
              placeholder="항목명 (예: 아파트 관리비, 성과급 인센티브, 연금저축)" 
              value={title} 
              onChange={(e) => setTitle(e.target.value)} 
              className="w-full border p-2.5 rounded-xl text-xs" 
              required 
            />

            <input 
              type="number" 
              placeholder="금액 (원)" 
              value={amount} 
              onChange={(e) => setAmount(e.target.value)} 
              className="w-full border p-2.5 rounded-xl text-xs" 
              required 
            />

            <div className="space-y-1">
              <label className="text-[11px] font-bold text-slate-600">목적 통장 선택</label>
              <select 
                value={targetAccount} 
                onChange={(e) => setTargetAccount(e.target.value)}
                className="w-full border p-2.5 rounded-xl text-xs bg-white"
              >
                {accounts.map(a => (
                  <option key={a.id} value={a.name}>{a.name}</option>
                ))}
              </select>
            </div>

            <button 
              type="submit" 
              className="w-full bg-indigo-600 text-white font-bold text-xs py-3 rounded-xl shadow-lg mt-2"
            >
              항목 추가하기
            </button>
          </form>
        </div>
      );
    }

    function EditTransactionModal({ editTx, accounts, onSave, onClose }) {
      const [title, setTitle] = useState(editTx.title || '');
      const [category, setCategory] = useState(editTx.category || '공과금');
      const [targetAccount, setTargetAccount] = useState(editTx.targetAccount || accounts[0]?.name || '고정비 통장');
      const [isFixed, setIsFixed] = useState(editTx.isFixed !== undefined ? editTx.isFixed : true);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!title.trim()) return;
        onSave({
          ...editTx,
          title: title.trim(),
          category,
          targetAccount,
          isFixed
        });
      };

      return (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fadeIn">
          <form onSubmit={handleSubmit} className="bg-white rounded-2xl w-full max-w-sm p-5 shadow-2xl space-y-3">
            <div className="flex justify-between items-center border-b pb-2">
              <div className="flex items-center space-x-2">
                <i className="fa-solid fa-pen-to-square text-indigo-600 text-sm"></i>
                <h3 className="font-extrabold text-slate-800 text-sm">✏️ 항목 정보 수정</h3>
              </div>
              <button type="button" onClick={onClose} className="text-slate-400 hover:text-slate-600">
                <i className="fa-solid fa-xmark"></i>
              </button>
            </div>

            <div className="space-y-1">
              <label className="text-[11px] font-bold text-slate-600">항목 이름</label>
              <input 
                type="text" 
                value={title} 
                onChange={(e) => setTitle(e.target.value)} 
                className="w-full border border-slate-300 p-2.5 rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none" 
                required 
              />
            </div>

            {editTx.type === 'INCOME' && (
              <div className="space-y-1">
                <label className="text-[11px] font-bold text-slate-600">수입 세부 구분</label>
                <select 
                  value={category} 
                  onChange={(e) => setCategory(e.target.value)}
                  className="w-full border border-slate-300 p-2.5 rounded-xl text-xs bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                >
                  <option value="급여">기본 급여</option>
                  <option value="월세">월세 임대 수입</option>
                  <option value="상여금">명절 상여금 (초과근무 제외)</option>
                  <option value="인센티브">비정기 인센티브/성과급 (초과근무 제외)</option>
                  <option value="기타">기타 수입</option>
                </select>
              </div>
            )}

            {(editTx.type === 'EXPENSE' || editTx.type === 'INVESTMENT') && (
              <div className="flex items-center space-x-2 text-xs py-1">
                <input 
                  type="checkbox" 
                  id="editFixedCheck" 
                  checked={isFixed} 
                  onChange={(e) => setIsFixed(e.target.checked)} 
                  className="rounded text-indigo-600"
                />
                <label htmlFor="editFixedCheck" className="font-semibold text-slate-700">
                  {editTx.type === 'INVESTMENT' ? '고정 투자 여부 (매달 정액 적립/투자)' : '고정비 여부 (체크 시 매달 정액 지출)'}
                </label>
              </div>
            )}

            <div className="space-y-1">
              <label className="text-[11px] font-bold text-slate-600">목적 통장 지정</label>
              <select 
                value={targetAccount} 
                onChange={(e) => setTargetAccount(e.target.value)}
                className="w-full border border-slate-300 p-2.5 rounded-xl text-xs bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none"
              >
                {accounts.map(a => (
                  <option key={a.id} value={a.name}>{a.name}</option>
                ))}
              </select>
            </div>

            <div className="grid grid-cols-2 gap-2 pt-2 border-t border-slate-100">
              <button 
                type="button" 
                onClick={onClose}
                className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs py-2.5 rounded-xl transition-colors"
              >
                취소
              </button>
              <button 
                type="submit" 
                className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs py-2.5 rounded-xl shadow transition-colors"
              >
                저장하기
              </button>
            </div>
          </form>
        </div>
      );
    }

    function TrendChart({ transactions, currentYear, currentMonth, monthKey }) {
      const canvasRef = useRef(null);

      const last6Months = useMemo(() => {
        const list = [];
        for (let i = 5; i >= 0; i--) {
          let m = currentMonth - i;
          let y = currentYear;
          while (m <= 0) {
            m += 12;
            y -= 1;
          }
          const key = `${y}-${String(m).padStart(2, '0')}`;
          list.push({ label: `${m}월`, key });
        }
        return list;
      }, [currentYear, currentMonth]);

      useEffect(() => {
        if (!canvasRef.current) return;
        const ctx = canvasRef.current.getContext('2d');

        const varExpenses = transactions.filter(t => t.type === 'EXPENSE' && !t.isFixed);

        const colors = [
          { border: '#6366f1', bg: 'rgba(99, 102, 241, 0.1)' },
          { border: '#f59e0b', bg: 'rgba(245, 158, 11, 0.1)' },
          { border: '#10b981', bg: 'rgba(16, 185, 129, 0.1)' },
          { border: '#ec4899', bg: 'rgba(236, 72, 153, 0.1)' },
          { border: '#3b82f6', bg: 'rgba(59, 130, 246, 0.1)' },
          { border: '#8b5cf6', bg: 'rgba(139, 92, 246, 0.1)' },
        ];

        const datasets = varExpenses.map((tx, idx) => {
          const color = colors[idx % colors.length];
          const data = last6Months.map(m => {
            if (tx.history && tx.history[m.key] !== undefined) {
              return Number(tx.history[m.key]);
            }
            if (m.key === monthKey) {
              return Number(tx.actualAmount) || Number(tx.estimatedAmount) || 0;
            }
            return 0;
          });

          return {
            label: tx.title,
            data: data,
            borderColor: color.border,
            backgroundColor: color.bg,
            tension: 0.3,
            fill: idx === 0
          };
        });

        const chart = new Chart(ctx, {
          type: 'line',
          data: {
            labels: last6Months.map(m => m.label),
            datasets: datasets
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } }
            },
            scales: {
              y: { 
                ticks: { 
                  font: { size: 9 },
                  callback: (val) => (val >= 10000 ? (val / 10000) + '만' : val.toLocaleString())
                } 
              },
              x: { ticks: { font: { size: 9 } } }
            }
          }
        });

        return () => chart.destroy();
      }, [transactions, last6Months, monthKey]);

      return (
        <div className="h-56 w-full">
          <canvas ref={canvasRef}></canvas>
        </div>
      );
    }

    function IncomeExpenseInvestChart({ transactions, currentYear, currentMonth, monthKey }) {
      const canvasRef = useRef(null);

      const last6Months = useMemo(() => {
        const list = [];
        for (let i = 5; i >= 0; i--) {
          let m = currentMonth - i;
          let y = currentYear;
          while (m <= 0) {
            m += 12;
            y -= 1;
          }
          const key = `${y}-${String(m).padStart(2, '0')}`;
          list.push({ label: `${m}월`, key });
        }
        return list;
      }, [currentYear, currentMonth]);

      useEffect(() => {
        if (!canvasRef.current) return;
        const ctx = canvasRef.current.getContext('2d');

        const isIrregular = (t) => {
          if (!t) return false;
          const cat = t.category || '';
          const title = t.title || '';
          return cat === '상여금' || cat === '인센티브' || title.includes('상여금') || title.includes('인센티브');
        };

        const getMonthVal = (t, mKey) => {
          if (t.history && t.history[mKey] !== undefined) return Number(t.history[mKey]) || 0;
          if (mKey === monthKey) return Number(t.actualAmount) || 0;
          if (isIrregular(t)) return 0;
          if (t.isFixed) return Number(t.estimatedAmount) || 0;
          return 0;
        };

        const incomeData = last6Months.map(m => {
          return transactions
            .filter(t => t.type === 'INCOME')
            .reduce((sum, t) => sum + getMonthVal(t, m.key), 0);
        });

        const expenseData = last6Months.map(m => {
          return transactions
            .filter(t => t.type === 'EXPENSE')
            .reduce((sum, t) => sum + getMonthVal(t, m.key), 0);
        });

        const investData = last6Months.map(m => {
          return transactions
            .filter(t => t.type === 'INVESTMENT')
            .reduce((sum, t) => sum + getMonthVal(t, m.key), 0);
        });

        const chart = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: last6Months.map(m => m.label),
            datasets: [
              {
                label: '수입',
                data: incomeData,
                backgroundColor: '#10b981',
                borderRadius: 4
              },
              {
                label: '지출',
                data: expenseData,
                backgroundColor: '#f43f5e',
                borderRadius: 4
              },
              {
                label: '투자',
                data: investData,
                backgroundColor: '#9333ea',
                borderRadius: 4
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } }
            },
            scales: {
              y: { 
                ticks: { 
                  font: { size: 9 },
                  callback: (val) => (val / 10000) + '만'
                } 
              },
              x: { ticks: { font: { size: 9 } } }
            }
          }
        });

        return () => chart.destroy();
      }, [transactions, last6Months, monthKey]);

      return (
        <div className="h-56 w-full">
          <canvas ref={canvasRef}></canvas>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    if (rootElement) {
      const root = ReactDOM.createRoot(rootElement);
      root.render(<PaydayApp />);
    }
  </script>
</body>
